spring.application.name=ensino-emi-api
# Banco de dados (valores vêm de variáveis de ambiente)
spring.datasource.url=jdbc:mysql://localhost:3306/emi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Flyway
spring.flyway.enabled=true
# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-2.5-flash
# CORS: origens do front-end separadas por vírgula (troque pela origem real na apresentação)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
